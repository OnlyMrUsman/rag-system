[project]
name = "rag-system"
version = "0.1.0"
description = "Production-grade multilingual RAG system with Qdrant, hybrid search, BGE-M3 embeddings, reranking, FastAPI, and RAGAS evaluation."
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
